sentence=Arduino client for the InstantIoT mobile app — the board writes a value at an address, the app decides what it looks like.
paragraph=Connects an ESP32, ESP8266 or Arduino Uno R4 WiFi to the InstantIoT mobile app — over the board's own Wi-Fi, through a server you host, or through the InstantIoT Cloud over TLS. One header, one object, one begin(): InstantIoT.begin(WiFiLink(ssid, pass), Cloud(token)). The board writes values at addresses I0..I255 and reacts to the ones written to it; whether a value is drawn as a gauge, a chart or a number is decided in the app, without reflashing. Declarative DSL at file scope: ISimpleButton(I0) { WHEN_PRESSED { ... } } and ISignal(I5, float setpoint) { ... } — no boilerplate. A setpoint survives a reboot: the server replays it on connect. Compact binary protocol, 14 bytes for a float, no dynamic memory. Bluetooth Classic, BLE and SoftwareSerial links ship in source as preview — the mobile app does not expose them yet (see README).
